<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notion AI — modo ligero</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, sans-serif; background:#0f1115; color:#e8e8ea; display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 12px; background:#171a21; display:flex; gap:8px; align-items:center; }
  #pill { margin-left:auto; font-size:12px; color:#8b93a3; text-align:right; max-width:46%; }
  button { font:inherit; color:inherit; cursor:pointer; background:#22262f; border:1px solid #333947; border-radius:9px; padding:7px 9px; }
  button:disabled { opacity:.5; cursor:default; }
  input, textarea { font:inherit; color:inherit; background:#22262f; border:1px solid #333947; border-radius:9px; padding:9px 10px; }
  #msgs { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .m { max-width:88%; padding:10px 12px; border-radius:13px; white-space:pre-wrap; word-wrap:break-word; }
  .yo { align-self:flex-end; background:#2f6fed; }
  .ia { align-self:flex-start; background:#1d212b; border:1px solid #2a2f3a; }
  .parcial { opacity:.75; }
  .estado { align-self:center; color:#8b93a3; font-size:13px; text-align:center; }
  .aviso { align-self:stretch; background:#241c1c; border:1px solid #5a2f2f; border-radius:13px; padding:10px 12px; font-size:14px; }
  .fila { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  #espejo, #panel { display:none; flex:1; overflow-y:auto; padding:14px; margin:0; }
  #espejo { white-space:pre-wrap; word-wrap:break-word; font:13px/1.5 ui-monospace, Menlo, monospace; color:#c9d1d9; }
  #panel h3 { margin:14px 0 4px; font-size:16px; }
  .sub { color:#8b93a3; font-size:13px; margin:4px 0 8px; }
  pre.mini { background:#0b0d11; border:1px solid #222733; border-radius:9px; padding:10px; white-space:pre-wrap; word-wrap:break-word; font:12px/1.45 ui-monospace, monospace; max-height:40vh; overflow:auto; color:#c9d1d9; }
  footer { padding:8px 10px 12px; background:#171a21; }
  #hoja { display:none; background:#1a1e27; border:1px solid #2a2f3a; border-radius:13px; padding:10px; margin-bottom:8px; max-height:48vh; overflow:auto; }
  #hoja h4 { margin:0 0 6px; font-size:14px; }
  #chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { background:#1d212b; border:1px solid #2a2f3a; border-radius:8px; padding:4px 8px; font-size:13px; }
  .caja { background:#22262f; border:1px solid #333947; border-radius:16px; padding:8px 8px 6px; }
  .caja textarea { width:100%; border:0; background:transparent; padding:2px 4px 4px; resize:none; height:44px; outline:none; }
  .barra { display:flex; gap:6px; align-items:center; }
  .mod { background:#1d212b; border-radius:999px; padding:6px 11px; font-size:13px; max-width:58%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .der { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .env { background:#2f6fed; border-color:#2f6fed; border-radius:999px; padding:7px 15px; }
  .opt { display:block; width:100%; text-align:left; margin:4px 0; }
  .opt.sel { border-color:#2f6fed; background:#1b2740; }
  a.opt { display:block; text-decoration:none; color:inherit; }
</style>
</head>
<body>
<header>
  <b id="bname">⚡ Notion AI</b>
  <span id="pill"></span>
  <button id="bchats" type="button" title="Chats: historial, cambiar, nuevo">💬</button>
  <button id="bespejo" type="button" title="Espejo de la pagina">🪞</button>
  <button id="bcfg" type="button" title="Ajustes y cuenta">⚙</button>
</header>
<div id="panel"></div>
<div id="msgs"></div>
<pre id="espejo"></pre>
<footer>
  <div id="hoja"></div>
  <div class="caja">
    <div id="chips"></div>
    <textarea id="t" placeholder="Escribe tu mensaje... (Enter envia, Shift+Enter salto)"></textarea>
    <div class="barra">
      <button id="bmod" class="mod" type="button">🤖 Auto ▾</button>
      <div class="der">
        <button id="badj" type="button" title="Adjuntar archivo">📎</button>
        <button id="b" class="env" type="button">Enviar</button>
      </div>
    </div>
  </div>
</footer>
<script>
var $ = function(i){ return document.getElementById(i); };
var msgs = $("msgs"), panel = $("panel"), hoja = $("hoja");
var clave = localStorage.getItem("nl_clave") || "";
var burbuja = null, espejoOn = false, abierta = "", ultimo = "";
var modeloActual = "", listaModelos = null, adjuntos = [], chatsActual = "";
var NOTION = "https://www." + "notion" + ".so/";
var PANT = [["Cuenta", "my-account"], ["Notificaciones", "my-notifications"],
            ["Conexiones", "my-connections"], ["Espacio de trabajo", "my-settings"]];
var ETQ = {lista:"✓ pagina lista", cargando:"⏳ cargando Notion...", navegando:"⏳ abriendo...",
  login:"⚠ pide iniciar sesion (⚙)", "sin-composer":"⚠ sin cuadro de chat", error:"⚠ error",
  iniciando:"⏳ iniciando...", "otra-pagina":"🔧 en configuracion"};
var RX_ERR = /(algo sali[oó] mal|something went wrong|int[eé]ntalo de nuevo|try again later|se produjo un error)/i;

function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function add(cls, txt) {
  var d = document.createElement("div");
  d.className = "m " + cls; d.textContent = txt;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  return d;
}
function aviso(html) {
  var d = document.createElement("div");
  d.className = "aviso"; d.innerHTML = html;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  return d;
}
function estado(txt) {
  var e = document.querySelector(".estado");
  if (!txt) { if (e) e.remove(); return; }
  if (!e) e = add("estado", "");
  e.textContent = txt;
}
function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({"X-Clave": clave}, opts.headers || {});
  return fetch(path, opts).then(function(r){ return r.json(); });
}
function verChat(){ panel.style.display="none"; $("espejo").style.display="none"; espejoOn=false; msgs.style.display="flex"; }
function verPanel(h){ panel.innerHTML=h; panel.style.display="block"; msgs.style.display="none"; $("espejo").style.display="none"; espejoOn=false; cerrarHoja(); }
function cerrarHoja(){ hoja.style.display="none"; hoja.innerHTML=""; abierta=""; }
function pintarModelo(){ $("bmod").textContent = "🤖 " + (modeloActual || "Auto") + " ▾"; }
function pintarChips() {
  var h = "", i;
  for (i = 0; i < adjuntos.length; i++) h += '<span class="chip">📎 ' + esc(adjuntos[i]) + '</span>';
  $("chips").innerHTML = h;
}

/* ---------- estado de la pagina ---------- */
function tickSalud() {
  fetch("/salud").then(function(r){ return r.json(); }).then(function(d) {
    $("pill").textContent = ETQ[d.pagina] || d.pagina || "";
    if (d.modelo && d.modelo !== modeloActual) { modeloActual = d.modelo; pintarModelo(); }
    if (d.cuenta) $("bname").textContent = "⚡ " + d.cuenta;
  }).catch(function(){});
  setTimeout(tickSalud, 6000);
}
pintarModelo(); tickSalud();

/* ---------- 🤖 selector de IA, dentro del chat ---------- */
function pintarHojaModelos(cargando) {
  var h = '<h4>🤖 Elegir IA</h4>', i, n;
  if (listaModelos && listaModelos.length) {
    for (i = 0; i < listaModelos.length; i++) {
      n = listaModelos[i];
      h += '<button class="opt' + (n === modeloActual ? ' sel' : '') + '" data-m="' + esc(n) + '">' +
           (n === modeloActual ? '✓ ' : '') + esc(n) + '</button>';
    }
  }
  if (cargando) h += '<p class="sub">leyendo el selector de Notion...</p>';
  else if (!listaModelos || !listaModelos.length)
    h += '<p class="sub">No encontre el selector de modelos en esta pagina. Espera a "✓ pagina lista" y vuelve a intentar, o mira ⚙ → Diagnostico.</p>';
  h += '<div class="fila"><button data-a="remod">↻ Volver a buscar</button><button data-a="cerrar">Cerrar</button></div>';
  hoja.innerHTML = h;
}
function cargarModelos() {
  pintarHojaModelos(true);
  api("/modelos").then(function(d) {
    if (d.actual) modeloActual = d.actual;
    if (d.modelos) listaModelos = d.modelos;
    pintarModelo(); pintarHojaModelos(false);
    if (d.error || d.ocupado)
      hoja.insertAdjacentHTML("beforeend", '<p class="sub">⚠ ' + esc(d.error || "ocupado ahora mismo, reintenta en unos segundos") + '</p>');
  }).catch(function(){ pintarHojaModelos(false); });
}
$("bmod").onclick = function() {
  if (abierta === "mod") { cerrarHoja(); return; }
  verChat(); abierta = "mod"; hoja.style.display = "block";
  if (listaModelos) pintarHojaModelos(false);
  cargarModelos();
};

/* ---------- 💬 chats: historial, cambiar, nuevo ---------- */
function pintarHojaChats(items, nota) {
  var h = '<h4>💬 Chats</h4>' +
          '<div class="fila"><button data-a="nuevo">＋ Nuevo chat</button>' +
          '<button data-a="rechats">↻ Actualizar</button>' +
          '<button data-a="cerrar">Cerrar</button></div>', i;
  if (nota) h += '<p class="sub">' + esc(nota) + '</p>';
  if (items && items.length) {
    h += '<p class="sub">Tu historial (panel lateral) — toca uno para cambiar:</p>';
    for (i = 0; i < items.length; i++)
      h += '<button class="opt' + (items[i].h === chatsActual ? ' sel' : '') + '" data-c="' + esc(items[i].h) + '">' +
           (items[i].h === chatsActual ? '✓ ' : '') + (items[i].chat ? '💬 ' : '📄 ') + esc(items[i].t) + '</button>';
  } else if (!nota) {
    h += '<p class="sub">no encontre chats en el panel lateral — prueba ↻ Actualizar</p>';
  }
  h += '<p class="sub">Tip de optimizacion: trabaja en un chat VACIO (＋ Nuevo chat); los chats largos cargan mas RAM.</p>';
  hoja.innerHTML = h;
}
function cargarChats() {
  pintarHojaChats(null, "leyendo el historial...");
  api("/chats").then(function(d) {
    if (d.error || d.ocupado) { pintarHojaChats(null, "⚠ " + (d.error || "ocupado ahora, reintenta")); return; }
    chatsActual = d.actual || "";
    pintarHojaChats(d.chats || [], null);
  }).catch(function(){ pintarHojaChats(null, "error de red con el servidor"); });
}
$("bchats").onclick = function() {
  if (abierta === "chats") { cerrarHoja(); return; }
  verChat(); abierta = "chats"; hoja.style.display = "block";
  cargarChats();
};

/* ---------- 📎 archivos, dentro del chat ---------- */
function pintarHojaArchivos(items, nota, baj) {
  var h = '<h4>📎 Adjuntar archivo</h4>' +
          '<div class="fila"><input type="file" id="f" multiple></div>', i, todos;
  if (nota) h += '<p class="sub">' + esc(nota) + '</p>';
  if (items && items.length) {
    h += '<p class="sub">Ya subidos — toca uno para adjuntarlo:</p>';
    for (i = 0; i < items.length; i++)
      h += '<div class="fila"><button class="opt" style="flex:1" data-adj="' + esc(items[i].nombre) + '">' +
           esc(items[i].nombre) + ' · ' + items[i].kb + ' KB</button>' +
           '<button data-del="' + esc(items[i].nombre) + '">🗑</button></div>';
  }
  if (baj) {
    todos = [];
    for (i = 0; i < (baj.descargas || []).length; i++) todos.push({n: baj.descargas[i].nombre, kb: baj.descargas[i].kb, de: "descargas"});
    for (i = 0; i < (baj.subidas || []).length; i++) todos.push({n: baj.subidas[i].nombre, kb: baj.subidas[i].kb, de: "subidas"});
    if (todos.length) {
      h += '<p class="sub">⬇ En el pod — toca para descargarlo a este aparato:</p>';
      for (i = 0; i < todos.length; i++)
        h += '<a class="opt" href="/descargar?de=' + todos[i].de + '&nombre=' + encodeURIComponent(todos[i].n) +
             '&clave=' + encodeURIComponent(clave) + '">' + esc(todos[i].n) + ' · ' + todos[i].kb + ' KB</a>';
    }
  }
  h += '<div class="fila"><button data-a="cerrar">Cerrar</button></div>';
  hoja.innerHTML = h;
  var inp = $("f");
  if (inp) inp.onchange = function() { subir(inp.files); };
}
function cargarArchivos(nota) {
  var arc = [], baj = null;
  api("/archivos").then(function(d){ arc = d.archivos || []; }).catch(function(){})
    .then(function(){ return api("/bajables").then(function(d){ baj = d; }).catch(function(){}); })
    .then(function(){ pintarHojaArchivos(arc, nota, baj); });
}
function subir(fs) {
  var i = 0;
  (function next() {
    if (i >= fs.length) { cargarArchivos("subida lista ✓"); return; }
    var f = fs[i++];
    pintarHojaArchivos(null, "subiendo " + f.name + "...");
    fetch("/subir?nombre=" + encodeURIComponent(f.name),
          {method:"POST", headers:{"X-Clave": clave}, body: f})
      .then(function(r){ return r.json(); }).then(function(){ next(); }).catch(function(){ next(); });
  })();
}
$("badj").onclick = function() {
  if (abierta === "arch") { cerrarHoja(); return; }
  verChat(); abierta = "arch"; hoja.style.display = "block";
  pintarHojaArchivos(null, "cargando...");
  cargarArchivos();
};

/* ---------- clicks de la hoja ---------- */
hoja.addEventListener("click", function(ev) {
  var t = ev.target;
  if (t.tagName !== "BUTTON") return;
  var m = t.getAttribute("data-m"), adj = t.getAttribute("data-adj"),
      del = t.getAttribute("data-del"), c = t.getAttribute("data-c"),
      a = t.getAttribute("data-a");
  if (m) {
    t.textContent = "cambiando...";
    api("/modelo", {method:"POST", body:m}).then(function(r) {
      cerrarHoja();
      if (r.error) { add("estado", "⚠ " + r.error); return; }
      modeloActual = r.modelo || m; pintarModelo();
      add("estado", "IA: " + modeloActual + " ✓");
      $("t").focus();
    });
  } else if (adj) {
    t.textContent = "adjuntando...";
    api("/adjuntar", {method:"POST", body:adj}).then(function(r) {
      if (r.error) { pintarHojaArchivos(null, "⚠ " + r.error); cargarArchivos("⚠ " + r.error); return; }
      adjuntos.push(adj); pintarChips(); cerrarHoja();
      add("estado", "📎 " + adj + " adjuntado (" + (r.via || "ok") + ") — escribe tu mensaje y envia");
      $("t").focus();
    });
  } else if (del) {
    api("/borrar-archivo", {method:"POST", body:del}).then(function(){ cargarArchivos(); });
  } else if (c) {
    t.textContent = "cambiando...";
    api("/destino", {method:"POST", body:c}).then(function(r) {
      cerrarHoja(); verChat();
      if (r.error) { add("estado", "⚠ " + r.error); return; }
      chatsActual = c;
      add("estado", "cambiando de chat... espera ✓ pagina lista");
    });
  } else if (a === "nuevo") {
    t.textContent = "creando...";
    api("/nuevo-chat", {method:"POST"}).then(function(r) {
      if (r.error) { pintarHojaChats(null, "⚠ " + r.error); return; }
      chatsActual = r.url || "";
      cerrarHoja(); verChat();
      add("estado", "chat nuevo creado — espera ✓ pagina lista");
      $("t").focus();
    }).catch(function(){ pintarHojaChats(null, "⚠ tardo demasiado — reabre 💬 para ver si se creo"); });
  } else if (a === "rechats") {
    cargarChats();
  } else if (a === "remod") {
    listaModelos = null; cargarModelos();
  } else if (a === "cerrar") {
    cerrarHoja();
  }
});

/* ---------- ⚙ ajustes, sesion, cuenta y diagnostico ---------- */
$("bcfg").onclick = function() {
  var h = '<h3>⚙ Ajustes</h3>' +
    '<div class="fila"><input id="clave" type="password" placeholder="clave" value="' + esc(clave) + '"></div>' +
    '<div class="fila"><input id="destino" placeholder="URL de tu chat de Notion AI" style="flex:1"></div>' +
    '<div class="fila"><button data-a="guardar">Guardar</button>' +
    '<button data-a="recargar">♻ Recargar pagina</button>' +
    '<button data-a="diag">🩺 Diagnostico</button></div>' +
    '<h3>🔑 Sesion de Notion</h3>' +
    '<p class="sub" id="sestado">leyendo el estado de la sesion...</p>' +
    '<div class="fila"><input id="semail" type="email" autocomplete="email" placeholder="correo de tu cuenta" style="flex:1">' +
    '<button data-a="scorreo">1 · Enviar codigo</button></div>' +
    '<div class="fila"><input id="scod" inputmode="numeric" autocomplete="one-time-code" placeholder="codigo que llega al correo" style="flex:1">' +
    '<button data-a="scod">2 · Entrar</button></div>' +
    '<div class="fila"><button data-a="ssalir">Cerrar sesion</button></div>' +
    '<p class="sub">Solo correo + codigo. NUNCA pulses "Continuar con Google": la IP del datacenter hace que Google bloquee la cuenta (ya paso una vez).</p>' +
    '<h3>👤 Cuenta y configuracion de Notion</h3>' +
    '<p class="sub">Abro esas pantallas en el navegador oculto y te las muestro en texto con sus botones pulsables. Al enviar un mensaje se vuelve solo al chat.</p><div class="fila">';
  for (var i = 0; i < PANT.length; i++)
    h += '<button data-ir="' + PANT[i][1] + '">' + PANT[i][0] + '</button>';
  h += '</div><div class="fila"><button data-a="ctrl">Ver botones de la pantalla</button>' +
       '<button data-a="creditos">💳 Creditos del plan</button>' +
       '<button data-a="volver">Volver al chat de IA</button></div><div id="vista"></div>' +
       '<div class="fila"><button data-a="chat">Cerrar ajustes</button></div>';
  verPanel(h);
  api("/destino").then(function(d){ if ($("destino")) $("destino").value = d.destino || ""; }).catch(function(){});
  api("/sesion").then(function(d){ verSesion(null, d); }).catch(function(){ verSesion("no pude leer el estado de la sesion"); });
};
function verSesion(txt, d) {
  var el = $("sestado");
  if (!el) return;
  if (txt) { el.textContent = txt; return; }
  if (!d) return;
  if (d.error || d.ocupado) { el.textContent = "⚠ " + (d.error || "ocupado ahora mismo, reintenta"); return; }
  el.textContent = d.parece_login
    ? "⚠ NO hay sesion iniciada — escribe tu correo y pulsa 1"
    : ("Sesion activa" + (d.correo ? " · " + d.correo : "") +
       ". Si NO es la cuenta que quieres: pulsa Cerrar sesion y entra con la otra.");
}
function verPantalla() {
  api("/pantalla-texto").then(function(d) {
    $("vista").innerHTML = '<p class="sub">' + esc(d.titulo || "") + '</p><pre class="mini">' + esc(d.texto || "(vacio)") + '</pre>';
  });
}
function verControles() {
  $("vista").innerHTML = '<p class="sub">leyendo botones...</p>';
  api("/controles").then(function(d) {
    if (d.error || d.ocupado) { $("vista").innerHTML = '<p class="sub">⚠ ' + esc(d.error || "ocupado") + '</p>'; return; }
    var c = d.controles || [], h = '<p class="sub">' + esc(d.titulo || "") + ' — pulsa cualquiera:</p>', i;
    for (i = 0; i < c.length; i++) h += '<button class="opt" data-i="' + c[i].i + '">' + esc(c[i].t) + '</button>';
    if (!c.length) h += '<p class="sub">no encontre botones visibles</p>';
    $("vista").innerHTML = h;
  });
}
function diagnostico(donde) {
  donde.innerHTML = '<p class="sub">probando el puente...</p>';
  api("/prueba").then(function(d) {
    donde.innerHTML = '<pre class="mini">' + esc(JSON.stringify(d, null, 1)) + '</pre>';
  }).catch(function(e){ donde.innerHTML = '<p class="sub">⚠ ' + esc(e) + '</p>'; });
}
panel.addEventListener("click", function(ev) {
  var t = ev.target;
  if (t.tagName !== "BUTTON") return;
  var ir = t.getAttribute("data-ir"), idx = t.getAttribute("data-i"), a = t.getAttribute("data-a");
  if (ir) {
    $("vista").innerHTML = '<p class="sub">abriendo... (unos segundos)</p>';
    api("/ir", {method:"POST", body: NOTION + ir}).then(function(){ setTimeout(verPantalla, 4000); });
  } else if (idx !== null) {
    t.textContent = "pulsando...";
    api("/clic?i=" + idx, {method:"POST"}).then(function(r) {
      if (r.error || r.ocupado) { $("vista").innerHTML = '<p class="sub">⚠ ' + esc(r.error || "ocupado") + '</p>'; return; }
      $("vista").innerHTML = '<p class="sub">' + esc(r.resultado) + '</p><pre class="mini">' + esc(r.texto || "") + '</pre>';
      setTimeout(verControles, 1200);
    });
  } else if (a === "scorreo") {
    var em = $("semail").value.trim();
    if (!em) { verSesion("escribe el correo primero"); return; }
    verSesion("⏳ abriendo el login y pidiendo el codigo para " + em + " (puede tardar ~20 s)...");
    api("/entrar", {method:"POST", body:em}).then(function(r) {
      verSesion(r.error ? ("⚠ " + r.error)
        : "✓ Codigo pedido. Revisa el correo de " + em + " en tu PC/telefono, copia el codigo y escribelo en el paso 2.");
    }).catch(function(){ verSesion("⚠ tardo demasiado — cierra y vuelve a abrir ⚙ para ver el estado real"); });
  } else if (a === "scod") {
    var cd = $("scod").value.trim();
    if (!cd) { verSesion("escribe el codigo primero"); return; }
    verSesion("⏳ entrando...");
    api("/codigo", {method:"POST", body:cd}).then(function(r) {
      if (r.error) { verSesion("⚠ " + r.error); return; }
      verSesion("✓ Sesion iniciada. Ahora elige tu chat con el boton 💬 de arriba (mejor uno nuevo y vacio).");
    }).catch(function(){ verSesion("⚠ tardo demasiado — cierra y vuelve a abrir ⚙ para ver el estado real"); });
  } else if (a === "ssalir") {
    if (!confirm("¿Cerrar la sesion de Notion en el navegador remoto?")) return;
    verSesion("⏳ cerrando sesion...");
    api("/salir", {method:"POST"}).then(function(r) {
      verSesion(r.error ? ("⚠ " + r.error)
        : "✓ Sesion cerrada. Escribe el correo de la cuenta nueva y pulsa 1.");
      if ($("destino")) $("destino").value = NOTION;
    }).catch(function(){ verSesion("⚠ tardo demasiado — cierra y vuelve a abrir ⚙ para verificar"); });
  } else if (a === "creditos") {
    $("vista").innerHTML = '<p class="sub">leyendo tu asignacion de creditos (unos segundos)...</p>';
    api("/creditos").then(function(d) {
      if (d.error || d.ocupado) { $("vista").innerHTML = '<p class="sub">⚠ ' + esc(d.error || "ocupado") + '</p>'; return; }
      var h = '';
      if (d.menu) h += '<p class="sub">No encontre la entrada de creditos. Esto hay en ajustes — dime cual es y lo agrego:</p><pre class="mini">' + esc((d.menu || []).join("\n")) + '</pre>';
      h += '<pre class="mini">' + esc(d.texto || "(vacio)") + '</pre>';
      $("vista").innerHTML = h;
    }).catch(function(){ $("vista").innerHTML = '<p class="sub">⚠ tardo demasiado — reintenta</p>'; });
  } else if (a === "chat") { verChat(); }
  else if (a === "ctrl") { verControles(); }
  else if (a === "diag") { diagnostico($("vista")); }
  else if (a === "volver") { api("/volver", {method:"POST"}); verChat(); add("estado", "volviendo al chat de IA..."); }
  else if (a === "recargar") { api("/recargar"); verChat(); add("estado", "recargando la pagina..."); }
  else if (a === "guardar") {
    clave = $("clave").value.trim();
    localStorage.setItem("nl_clave", clave);
    var d = $("destino").value.trim();
    (d ? api("/destino", {method:"POST", body:d}) : Promise.resolve({})).then(function(r) {
      verChat(); add("estado", (r && r.error) ? ("⚠ " + r.error) : "guardado ✓");
    });
  }
});

/* ---------- 🪞 espejo ---------- */
$("bespejo").onclick = function() {
  panel.style.display = "none"; cerrarHoja();
  espejoOn = !espejoOn;
  $("espejo").style.display = espejoOn ? "block" : "none";
  msgs.style.display = espejoOn ? "none" : "flex";
  if (espejoOn) tickEspejo();
};
function tickEspejo() {
  if (!espejoOn) return;
  api("/espejo").then(function(d) {
    $("espejo").textContent = d.texto || "cargando Notion en el navegador oculto...";
  }).catch(function(){});
  setTimeout(tickEspejo, 4000);
}

/* ---------- errores y recuperacion ---------- */
function avisoError(txt) {
  aviso('<b>⚠ Notion devolvio un error</b><br>' + esc(txt) +
    '<div class="fila"><button data-x="reenviar">🔄 Reenviar</button>' +
    '<button data-x="recargar">♻ Recargar Notion</button>' +
    '<button data-x="diag">🩺 Diagnostico</button></div>' +
    '<p class="sub">Si se repite: en la terminal corre <b>sh m.sh pantalla</b> para ver la pagina real, o <b>SIGILO=1 sh m.sh ligero</b> por si Notion bloquea el navegador automatizado.</p>');
}
msgs.addEventListener("click", function(ev) {
  var t = ev.target;
  if (t.tagName !== "BUTTON") return;
  var x = t.getAttribute("data-x");
  if (x === "reenviar" && ultimo) { $("t").value = ultimo; enviar(); }
  else if (x === "recargar") { api("/recargar"); add("estado", "recargando Notion... espera a ✓ pagina lista"); }
  else if (x === "diag") {
    var d = document.createElement("div");
    d.className = "aviso"; msgs.appendChild(d); diagnostico(d);
  }
});

/* ---------- enviar ---------- */
function enviar() {
  var t = $("t").value.trim();
  if (!t) return;
  $("t").value = "";
  verChat(); cerrarHoja();
  add("yo", t);
  ultimo = t;
  adjuntos = []; pintarChips();
  $("b").disabled = true;
  burbuja = null;
  estado("enviando...");
  api("/preguntar", {method:"POST", body:t}).then(function(r) {
    if (r.error) { estado(""); avisoError(r.error); $("b").disabled = false; return; }
    estado("Notion AI esta pensando...");
    (function poll() {
      setTimeout(function() {
        api("/estado?id=" + r.id).then(function(s) {
          if (s.listo) {
            estado("");
            if (burbuja) { burbuja.remove(); burbuja = null; }
            var txt = s.texto || "";
            if (s.error) { avisoError(s.error); }
            else if (RX_ERR.test(txt)) { avisoError(txt); }
            else { add("ia", txt || "(sin respuesta visible — prueba 🪞 espejo)"); }
            $("b").disabled = false; $("t").focus();
          } else {
            if (s.parcial) {
              estado("");
              if (!burbuja) burbuja = add("ia parcial", "");
              burbuja.textContent = s.parcial + " ▍";
              msgs.scrollTop = msgs.scrollHeight;
            }
            poll();
          }
        }).catch(function(){ poll(); });
      }, 2500);
    })();
  }).catch(function(e) {
    estado(""); avisoError("error de red con el servidor: " + e); $("b").disabled = false;
  });
}
$("b").onclick = enviar;
$("t").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
});
if (!clave) $("bcfg").click();
</script>
